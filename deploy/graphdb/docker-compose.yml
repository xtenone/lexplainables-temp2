# GraphDB — de BWB-kennisgraaf, op de docker-host.
#
# De data staat LOKAAL op de docker-host (/var/lib/graphdb/home), niet op een NFS-share: GraphDB's
# opslaglaag gebruikt geheugen-gemapte bestanden en file-locking, en over NFS levert dat traagheid
# op en in het slechtste geval stille indexcorruptie. De NAS is de plek voor back-ups (zie README).
#
# GraphDB >= 11.2 heeft een INGEBOUWDE MCP-server op /mcp. Er is dus geen aparte MCP-container:
# het nginx'je ervoor doet alleen de bearer-tokencontrole voor toegang van buiten.
#
# Het netwerk heet expliciet `graphdb_default`, zodat andere stacks (de dev-stack, een import)
# er als extern netwerk op kunnen joinen en GraphDB intern op http://graphdb:7200 bereiken.

services:
  graphdb:
    image: ontotext/graphdb:11.4.0
    container_name: graphdb
    restart: unless-stopped
    # Docker's default is 10 s en dan SIGKILL — te kort voor GraphDB, dat zijn opslaglaag moet
    # afsluiten. Vandaar de "Detected unclean shutdown" bij de start, met recovery en het opruimen
    # van inference-bestanden tot gevolg. Een halve minuut extra bij het stoppen is goedkoper dan
    # een herstelronde (of, bij slechte timing, een beschadigde index) bij het starten.
    stop_grace_period: 90s
    ports:
      - "7200:7200"                 # workbench-UI + SPARQL + ingebouwde MCP (/mcp)
    environment:
      # Let op het RAM van de host: GraphDB claimt de heap echt. Bij 4 GB draait de dev-stack
      # ernaast krap — 8 GB is comfortabeler, anders -Xmx1500m.
      GDB_JAVA_OPTS: >-
        -Xms1g -Xmx${GRAPHDB_HEAP:-2g}
      # Service-account voor de healthcheck (en dezelfde credentials die de proxy en de importer
      # gebruiken). GraphDB-security staat aan: zonder deze waarden komt niemand er meer in.
      GDB_USER: ${GRAPHDB_SVC_USER:?zet GRAPHDB_SVC_USER}
      GDB_PASSWORD: ${GRAPHDB_SVC_PASSWORD:?zet GRAPHDB_SVC_PASSWORD}
    volumes:
      - /var/lib/graphdb/home:/opt/graphdb/home
    healthcheck:
      # Met GraphDB-security aan geeft /rest/repositories 401 zonder credentials — de healthcheck
      # zou de container dan onterecht als unhealthy markeren.
      #
      # **curl, geen wget.** Dit stond op `wget --user=… --password=…` en dat markeerde de container
      # permanent unhealthy terwijl GraphDB gewoon draaide: GraphDB antwoordt op de 401 met TWEE
      # challenges (`Basic realm="GraphDB REST API endpoint"` én een parameterloze `GDB`), en de
      # GNU wget 1.21.4 uit deze image crasht op die tweede zodra hij door --user/--password de
      # challenge gaat parsen — SIGABRT, "Aborted (core dumped)", exit 134. Zonder credentials komt
      # hij er niet aan toe, dus het viel alleen hier op. Een healthcheck die altijd rood staat is
      # erger dan geen healthcheck: een echte storing valt dan niet meer op.
      test: ["CMD-SHELL", "curl -fsS -u \"$${GDB_USER}:$${GDB_PASSWORD}\" -o /dev/null http://localhost:7200/rest/repositories"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Bearer-token-authenticatie voor externe toegang tot GraphDB's ingebouwde MCP.
  mcp-auth-proxy:
    image: nginx:alpine
    container_name: mcp-auth-proxy
    restart: unless-stopped
    ports:
      - "8004:8004"
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/mcp.conf << 'ENDOFNGINX'
        map_hash_bucket_size 128;
        server {
            listen 8004;
            location /mcp {
                if ($$http_authorization !~ "^Bearer ${MCP_BEARER_TOKEN}$$") { return 401; }
                # Clienttoken gecontroleerd → vervang de header door het GraphDB-service-account.
                # De proxy is het enige pad naar de MCP en injecteert de credentials, zodat de
                # clients ze niet hoeven te kennen.
                proxy_set_header Authorization "Basic ${GRAPHDB_BASIC}";
                proxy_pass http://graphdb:7200;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $$host;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
            }
            location / { return 404; }
        }
        ENDOFNGINX
        exec nginx -g 'daemon off;'
    depends_on:
      - graphdb

  # Applicatie-consistente dump, elke nacht — plan hem vlak vóór de host-back-up, zodat de
  # dump daarin meelift. De host-back-up zelf is filesystem-consistent (snapshot met
  # fs-freeze), maar GraphDB kan daarbij midden in een schrijfactie zitten; een RDF-export is dat
  # per definitie niet. Twee lagen dus: de dump voor zekerheid, de host-back-up voor volledigheid.
  graphdb-backup:
    image: alpine:3.21
    container_name: graphdb-backup
    restart: unless-stopped
    depends_on:
      - graphdb
    environment:
      GDB_USER: ${GRAPHDB_SVC_USER:?zet GRAPHDB_SVC_USER}
      GDB_PASSWORD: ${GRAPHDB_SVC_PASSWORD:?zet GRAPHDB_SVC_PASSWORD}
    volumes:
      - /var/lib/graphdb/backup:/backup
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl tzdata >/dev/null
        cp /usr/share/zoneinfo/Europe/Amsterdam /etc/localtime
        cat > /usr/local/bin/dump.sh << 'ENDOFDUMP'
        #!/bin/sh
        set -eu
        REPO="$${GRAPHDB_REPOSITORY:-inning}"
        OUT="/backup/$${REPO}-$$(date +%Y%m%d-%H%M).nq.gz"
        # N-Quads houdt de named graphs vast (TriG/Turtle zou contexts verliezen).
        curl -fsS -u "$${GDB_USER}:$${GDB_PASSWORD}" -H 'Accept: application/n-quads' \
          "http://graphdb:7200/repositories/$${REPO}/statements" | gzip -9 > "$$OUT.tmp"
        # Pas hernoemen als de dump compleet is: een afgebroken run laat geen half bestand achter
        # dat er als geldige back-up uitziet.
        mv "$$OUT.tmp" "$$OUT"
        echo "$$(date -Iseconds) dump gereed: $$OUT ($$(wc -c < "$$OUT") bytes)"
        # Retentie: de laatste 7 dumps.
        ls -1t /backup/$${REPO}-*.nq.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
        ENDOFDUMP
        chmod +x /usr/local/bin/dump.sh
        echo '0 3 * * * /usr/local/bin/dump.sh >> /backup/backup.log 2>&1' > /etc/crontabs/root
        echo "backup-cron actief (03:00, retentie 7)"
        exec crond -f -l 8

networks:
  default:
    name: graphdb_default
